name: CI - Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore KanbanBoard.Api/KanbanBoard.Api.sln

      - name: Build solution
        run: dotnet build KanbanBoard.Api/KanbanBoard.Api.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test KanbanBoard.Tests/KanbanBoard.Tests.csproj --no-build --configuration Release --verbosity normal